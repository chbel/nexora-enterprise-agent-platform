# Host ports and Postgres credentials are read from .env (see .env.example).
# Container-to-container URLs below override the localhost values in .env.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentic_user}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-agentic_ai}
  REDIS_URL: redis://redis:6379/0
  QDRANT_HOST: qdrant
  POSTGRES_MCP_HOST: postgres-mcp
  DOCUMENT_MCP_HOST: document-mcp
  NOTIFICATION_MCP_HOST: notification-mcp

x-backend-build: &backend-build
  context: .
  dockerfile: infra/docker/backend.Dockerfile
  args:
    INSTALL_DEV: ${INSTALL_DEV:-true}

services:
  # ── Backend API ──────────────────────────────────────
  backend:
    build: *backend-build
    image: enterprise-agentic-ai-backend:local
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file: .env
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - ./tests:/app/tests
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # ── PostgreSQL MCP Server ────────────────────────────
  postgres-mcp:
    build: *backend-build
    image: enterprise-agentic-ai-backend:local
    ports:
      - "${POSTGRES_MCP_HOST_PORT:-8001}:8001"
    env_file: .env
    environment: *backend-env
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    command: python -m backend.mcp_servers.postgres_mcp.server

  # ── Document MCP Server ───────────────────────────────
  document-mcp:
    build: *backend-build
    image: enterprise-agentic-ai-backend:local
    ports:
      - "${DOCUMENT_MCP_HOST_PORT:-8002}:8002"
    env_file: .env
    environment: *backend-env
    depends_on:
      - backend
    healthcheck:
      disable: true
    command: python -m backend.mcp_servers.document_mcp.server

  # ── Notification MCP Server ───────────────────────────
  notification-mcp:
    build: *backend-build
    image: enterprise-agentic-ai-backend:local
    ports:
      - "${NOTIFICATION_MCP_HOST_PORT:-8003}:8003"
    env_file: .env
    environment: *backend-env
    depends_on:
      - backend
    healthcheck:
      disable: true
    command: python -m backend.mcp_servers.notification_mcp.server

  # ── Celery Worker ─────────────────────────────────────
  celery-worker:
    build: *backend-build
    image: enterprise-agentic-ai-backend:local
    env_file: .env
    environment: *backend-env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    command: celery -A backend.core.celery_app worker --loglevel=info --concurrency=4

  # ── Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
        NEXT_PUBLIC_WS_URL: ws://localhost:${BACKEND_PORT:-8000}
    image: enterprise-agentic-ai-frontend:local
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # ── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_ai}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Qdrant Vector DB ──────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Prometheus ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # ── Grafana ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}

volumes:
  postgres_data:
  qdrant_data:
